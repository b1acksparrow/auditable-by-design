[package]
name = "abd-zk-host"
version = "0.1.0"
edition = "2021"

[dependencies]
methods = { path = "../methods" }
# Local in-process proving only: no remote (Bonsai) client, and dev-mode fake proofs compiled out.
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["prove", "disable-dev-mode"] }
serde_json = "1"
bincode = "1.3"
hex = "0.4"
anyhow = "1"
# Same versions as pinned through risc0-zkvm =3.0.6; used only for the vendor's soundness calculator.
risc0-zkp = { version = "=3.0.5", default-features = false, features = ["prove"] }
risc0-circuit-rv32im = { version = "=4.0.5", default-features = false, features = ["prove"] }
risc0-circuit-recursion = { version = "=4.0.5", default-features = false, features = ["prove"] }
